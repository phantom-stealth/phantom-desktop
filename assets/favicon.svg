<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="vibrantGlow" cx="50%" cy="45%" r="55%" fx="50%" fy="40%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#7928CA" stop-opacity="0.30" />
      <stop offset="70%" stop-color="#FF0080" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#080C15" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Aegis Gradient: Hyper Cyan to Vivid Magenta -->
    <linearGradient id="shieldBorderGrad" x1="10%" y1="5%" x2="90%" y2="95%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="25%" stop-color="#4FACFE" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="75%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Deep Carbon Armor Fill -->
    <linearGradient id="shieldInnerGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#0E1626" />
      <stop offset="40%" stop-color="#090E1A" />
      <stop offset="100%" stop-color="#140B24" />
    </linearGradient>

    <!-- Metallic Specular Highlight -->
    <linearGradient id="specularGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="30%" stop-color="#7DD3FC" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#C084FC" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Ghost Monogram "P" Gradient -->
    <linearGradient id="phantomP_Grad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E0F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="75%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Dynamic Stealth Visor Slit Gradient -->
    <linearGradient id="visorGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00FF87" />
      <stop offset="35%" stop-color="#60EFFF" />
      <stop offset="70%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Beacon Pulse Radial -->
    <radialGradient id="beaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF87" />
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filters -->
    <filter id="hyperBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="visorGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Radiant Backlight -->
  <circle cx="256" cy="240" r="210" fill="url(#vibrantGlow)" />

  <!-- Outer Protective Halo Ring -->
  <circle cx="256" cy="245" r="236" fill="none" stroke="url(#shieldBorderGrad)" stroke-width="2.5" stroke-opacity="0.3" stroke-dasharray="12 8" />

  <!-- Primary Outer Shield (Faceted Stealth Geometry) -->
  <path
    d="M 256 42 
       L 436 116 
       L 436 244 
       C 436 358, 358 448, 256 476 
       C 154 448, 76 358, 76 244 
       L 76 116 
       Z"
    fill="url(#shieldInnerGrad)"
    stroke="url(#shieldBorderGrad)"
    stroke-width="12"
    stroke-linejoin="round"
    filter="url(#hyperBloom)"
  />

  <!-- Specular Light Sheen Overlay (Top Facet) -->
  <path
    d="M 256 48 
       L 428 120 
       L 428 244 
       C 428 348, 360 432, 256 468 
       L 256 48 
       Z"
    fill="url(#specularGlint)"
  />

  <!-- Internal Stealth Facet Lines -->
  <path
    d="M 256 48 L 256 468"
    stroke="url(#shieldBorderGrad)"
    stroke-width="2.5"
    stroke-opacity="0.4"
  />
  <path
    d="M 76 116 L 256 260 L 436 116"
    fill="none"
    stroke="url(#shieldBorderGrad)"
    stroke-width="3"
    stroke-opacity="0.25"
  />

  <!-- Left Wing Aero Vent -->
  <path
    d="M 124 168 L 196 226 L 196 312 L 124 256 Z"
    fill="#00F2FE"
    fill-opacity="0.08"
    stroke="#00F2FE"
    stroke-width="1.5"
    stroke-opacity="0.35"
  />

  <!-- Right Wing Aero Vent -->
  <path
    d="M 388 168 L 316 226 L 316 312 L 388 256 Z"
    fill="#EC4899"
    fill-opacity="0.08"
    stroke="#EC4899"
    stroke-width="1.5"
    stroke-opacity="0.35"
  />

  <!-- Central Futuristic Cyber "P" (Phantom Stealth Monogram) -->
  <path
    d="M 204 148 
       L 294 148 
       C 334 148, 360 174, 360 212 
       C 360 250, 334 276, 294 276 
       L 246 276 
       L 246 362 
       L 204 362 
       Z
       M 246 188 
       L 246 236 
       L 290 236 
       C 308 236, 320 226, 320 212 
       C 320 198, 308 188, 290 188 
       Z"
    fill="url(#phantomP_Grad)"
    stroke="#FFFFFF"
    stroke-width="2"
    stroke-opacity="0.5"
  />

  <!-- Luminous Horizontal Evasion Visor / Slit -->
  <path
    d="M 172 254 L 340 254"
    stroke="url(#visorGrad)"
    stroke-width="8"
    stroke-linecap="round"
    filter="url(#visorGlow)"
  />
  <circle cx="172" cy="254" r="5" fill="#00FF87" />
  <circle cx="340" cy="254" r="5" fill="#00F0FF" />

  <!-- Anti-Detection Quantum Beacon (Apex Evasion Indicator) -->
  <circle cx="256" cy="414" r="14" fill="url(#beaconGlow)" filter="url(#hyperBloom)" />
  <circle cx="256" cy="414" r="7" fill="#00FF87" />
  <circle cx="256" cy="414" r="3" fill="#FFFFFF" />

  <!-- Corner Tech Accents -->
  <circle cx="256" cy="48" r="4" fill="#00F2FE" />
  <circle cx="76" cy="116" r="3.5" fill="#38BDF8" />
  <circle cx="436" cy="116" r="3.5" fill="#EC4899" />
</svg>